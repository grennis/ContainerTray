name: ContainerTray
options:
  bundleIdPrefix: com.grennis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
targets:
  ContainerTray:
    type: application
    platform: macOS
    sources:
      - path: ContainerTray/Sources
    info:
      path: ContainerTray/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "ContainerTray opens Terminal to run an interactive container machine session."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grennis.ContainerTray
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
