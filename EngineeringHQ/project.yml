name: EngineeringHQ
options:
  bundleIdPrefix: com.grennis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
targets:
  EngineeringHQ:
    type: application
    platform: macOS
    sources:
      - path: EngineeringHQ/Sources
    info:
      path: EngineeringHQ/Info.plist
      properties:
        CFBundleDisplayName: Engineering HQ
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "Engineering HQ opens Terminal to run an interactive container machine session."
        # The Monitor module checks a backend on http://127.0.0.1:8080.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grennis.EngineeringHQ
        PRODUCT_NAME: EngineeringHQ
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
